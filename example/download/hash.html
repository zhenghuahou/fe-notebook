<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>hash模式</title>
  </head>
  <body>
    <style>  
        div {  
            height: 800px;  
            width: 400px;  
            border: 2px solid black;  
        }  
        h2 {  
            position: fixed;  
            margin:50px 500px;  
        }  
        .area1{
            background-color: aquamarine;
            height: 600px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
        }
        .area2{
            background-color: red;
            height: 700px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
        }
        .area3{
            background-color:chartreuse;
            height: 800px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
    </style>  
      
    <h2>  
        <a href="#div1">to div1</a>  
        <a href="#div2">to div2</a>  
        <a href="#div3">to div3</a>  
    </h2>  
        <div id="div1" class="area1">div1</div>  
        <div id="div2" class="area2">div2</div>  
        <div id="div3" class="area3">div3</div>  
    
  </body>
</html>
