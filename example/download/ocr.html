      /**
       * 检查摄像头权限状态
       * @returns {Promise<boolean>} 返回是否授予摄像头权限
       */
      async function checkCameraPermission() {
        console.info(" navigator.permissions:", navigator.permissions);
        // 标准Permissions API检测（Chrome/Firefox/Edge）
        if (navigator.permissions && navigator.permissions.query) {
          try {
            const status = await navigator.permissions.query({
              name: "camera",
            });
            return status.state === "granted";
          } catch (error) {
            alert("error" + error.message);
            // 部分浏览器不支持camera权限查询（如Safari）
            return checkViaMediaDevices();
          }
        }

        // 降级方案：通过mediaDevices API检测（可能触发权限弹窗）
        return checkViaMediaDevices();
      }

      /**
       * 通过mediaDevices API检测摄像头权限
       * @returns {Promise<boolean>}
       */
      async function checkViaMediaDevices() {
        console.info(" navigator.mediaDevices:", navigator.mediaDevices);
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          return false; // 完全不支持媒体设备
        }

        try {
          const stream = await navigator.mediaDevices.getUserMedia({
            video: true,
          });
          // 立即关闭摄像头流
          stream.getTracks().forEach((track) => track.stop());
          return true;
        } catch (error) {
          return error.name === "NotAllowedError" ? false : false;
        }
      }

      // 使用示例
      checkCameraPermission().then(hasPermission => {
        console.log('摄像头权限状态：', hasPermission ? '已授予' : '未授予');
      });
