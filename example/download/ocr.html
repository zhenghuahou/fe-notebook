<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      #log {
        height: 320px;
        overflow: scroll;
        padding: 0.5rem;
        border: 1px solid black;
      }
    </style>
    <script src="https://cdn.bootcdn.net/ajax/libs/vConsole/3.15.0/vconsole.min.js"></script>
    <script>
      // 初始化
      // var vConsole = new VConsole();
    </script>
    <script>
      window.addEventListener("error", function (event) {
        console.info(
          " [line14] addEventListener error event:",
          event,
          " event.message:",
          event.message
        );
      });
    </script>
  </head>
  <body>
    ---------- 上传图片/拍照demo: 有caputer="user"属性  (本地环境，可以拍照，可以选择相册文件，但是测试域名环境下只能拍照不能选择相册文件。测试环境和本地环境表现不一样)
    <input
      type="file"
      id="avatar1"
      name="avatar1"
      accept="image/*"
      caputer="user"
    />
    <br />
    <br />
    <br />

    ---------- 上传图片/拍照demo: 有caputer="environment"属性
    <input
      type="file"
      id="avatar1"
      name="avatar1"
      accept="image/*"
      caputer="environment"
    />


    <br />
    <br />
    <br />
    没有caputer="user"属性 (本地环境，可以拍照，也可以选择相册文件.测试环境域名也是可以拍照，也可以选择相册文件。测试环境和本地环境表现一样)
    <input type="file" id="avatar2" name="avatar2" accept="image/*" />

    <br />
    <br />

    capture="camera"
    <input type="file" id="cameraInput" accept="image/*" capture="camera" />
